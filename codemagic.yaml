workflows:
  android-release:
    name: AORANE Android Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: 22.14.0
      vars:
        EXPO_PUBLIC_API_URL: https://aorane.onrender.com/api
        PACKAGE_NAME: in.aorane.app

    scripts:
      - name: Install dependencies
        script: |
          cd artifacts/aorane-mobile
          npm install --legacy-peer-deps

      - name: Expo Prebuild (generate Android native code)
        script: |
          cd artifacts/aorane-mobile
          npx expo prebuild \
            --platform android \
            --clean \
            --no-install

      - name: Bundle JavaScript (Metro)
        script: |
          cd artifacts/aorane-mobile
          mkdir -p android/app/src/main/assets
          node_modules/.bin/react-native bundle \
            --platform android \
            --dev false \
            --entry-file node_modules/expo-router/entry.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res \
            --reset-cache 2>&1

      - name: Build Android AAB
        script: |
          cd artifacts/aorane-mobile/android
          chmod +x gradlew
          ./gradlew bundleRelease -x createBundleReleaseJsAndAssets

    artifacts:
      - artifacts/aorane-mobile/android/app/build/outputs/bundle/release/*.aab
      - artifacts/aorane-mobile/android/app/build/outputs/**/*.aab

    publishing:
      email:
        recipients:
          - mangeshangadverma@gmail.com
        notify:
          success: true
          failure: true
