workflows:
  android-release:
    name: AORANE Android Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: 20.18.0
      vars:
        EXPO_PUBLIC_API_URL: https://aorane.onrender.com/api
        PACKAGE_NAME: in.aorane.app

    scripts:
      - name: Setup pnpm
        script: |
          curl -fsSL https://get.pnpm.io/install.sh | env PNPM_VERSION=10.0.0 sh -
          echo 'export PATH="$HOME/.local/share/pnpm:$PATH"' >> $CM_ENV
          source $CM_ENV

      - name: Install all dependencies
        script: |
          export PATH="$HOME/.local/share/pnpm:$PATH"
          pnpm install --frozen-lockfile

      - name: Expo Prebuild (generate Android native code)
        script: |
          export PATH="$HOME/.local/share/pnpm:$PATH"
          cd artifacts/aorane-mobile
          npx expo prebuild \
            --platform android \
            --clean \
            --no-install

      - name: Build Android AAB
        script: |
          cd artifacts/aorane-mobile/android
          chmod +x gradlew
          ./gradlew bundleRelease

    artifacts:
      - artifacts/aorane-mobile/android/app/build/outputs/bundle/release/*.aab
      - artifacts/aorane-mobile/android/app/build/outputs/**/*.aab

    publishing:
      email:
        recipients:
          - mangeshangadverma@gmail.com
        notify:
          success: true
          failure: true
