workflows:
  android-release:
    name: AORANE Android Release Build (AAB)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: 22.14.0
      vars:
        EXPO_PUBLIC_API_URL: https://aorane.onrender.com/api
        PACKAGE_NAME: in.aorane.app
        NPM_CONFIG_LEGACY_PEER_DEPS: "true"
        EXPO_NO_TELEMETRY: "1"

    scripts:
      - name: Prepare workspace (hide pnpm config from npm/expo/gradle)
        script: |
          mv pnpm-workspace.yaml pnpm-workspace.yaml.bak

      - name: Install dependencies
        script: |
          cd artifacts/aorane-mobile
          npm install --legacy-peer-deps

      - name: Expo Prebuild (generate Android native code + autolink)
        script: |
          cd artifacts/aorane-mobile
          npx expo prebuild \
            --platform android \
            --clean \
            --no-install

      - name: Verify Health Connect autolinking
        script: |
          echo "=== settings.gradle (HC autolink check) ==="
          grep -i "health" artifacts/aorane-mobile/android/settings.gradle || echo "HC NOT FOUND in settings.gradle!"
          echo "=== PackageList check ==="
          find artifacts/aorane-mobile/android -name "PackageList.java" -exec grep -l "HealthConnect" {} \; 2>/dev/null || echo "PackageList not found or HC missing"
          echo "=== node_modules HC check ==="
          ls artifacts/aorane-mobile/node_modules/react-native-health-connect/android/src/main/java/dev/matinzd/healthconnect/ 2>/dev/null | head -5 || echo "HC android src not found"

      - name: Build Android AAB
        script: |
          set -e
          cd artifacts/aorane-mobile/android
          chmod +x gradlew
          ./gradlew bundleRelease 2>&1
          RESULT=$?
          cd ../../..
          mv pnpm-workspace.yaml.bak pnpm-workspace.yaml
          exit $RESULT

    artifacts:
      - artifacts/aorane-mobile/android/app/build/outputs/bundle/release/*.aab
      - artifacts/aorane-mobile/android/app/build/outputs/**/*.aab

    publishing:
      email:
        recipients:
          - mangeshangadverma@gmail.com
        notify:
          success: true
          failure: true

  android-apk:
    name: AORANE Android APK (Phone Testing)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: 22.14.0
      vars:
        EXPO_PUBLIC_API_URL: https://aorane.onrender.com/api
        PACKAGE_NAME: in.aorane.app
        NPM_CONFIG_LEGACY_PEER_DEPS: "true"
        EXPO_NO_TELEMETRY: "1"

    scripts:
      - name: Prepare workspace (hide pnpm config from npm/expo/gradle)
        script: |
          mv pnpm-workspace.yaml pnpm-workspace.yaml.bak

      - name: Install dependencies
        script: |
          cd artifacts/aorane-mobile
          npm install --legacy-peer-deps

      - name: Expo Prebuild (generate Android native code + autolink)
        script: |
          cd artifacts/aorane-mobile
          npx expo prebuild \
            --platform android \
            --clean \
            --no-install

      - name: Verify Health Connect autolinking
        script: |
          echo "=== settings.gradle (HC check) ==="
          grep -i "health" artifacts/aorane-mobile/android/settings.gradle || echo "HC NOT FOUND in settings.gradle!"
          echo "=== node_modules HC native src ==="
          ls artifacts/aorane-mobile/node_modules/react-native-health-connect/android/src/main/java/dev/matinzd/healthconnect/ 2>/dev/null || echo "NOT FOUND"

      - name: Build Android Release APK
        script: |
          set -e
          cd artifacts/aorane-mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease 2>&1
          RESULT=$?
          cd ../../..
          mv pnpm-workspace.yaml.bak pnpm-workspace.yaml
          exit $RESULT

    artifacts:
      - artifacts/aorane-mobile/android/app/build/outputs/apk/release/*.apk
      - artifacts/aorane-mobile/android/app/build/outputs/**/*.apk

    publishing:
      email:
        recipients:
          - mangeshangadverma@gmail.com
        notify:
          success: true
          failure: true
