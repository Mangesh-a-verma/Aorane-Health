services:
  - type: web
    name: aorane-api
    runtime: node
    region: singapore
    plan: free
    rootDir: artifacts/api-server
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        fromService:
          type: web
          name: aorane-api
          envVarKey: PORT
    autoDeploy: true
