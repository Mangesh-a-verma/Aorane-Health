services:
  - type: web
    name: aorane-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npx --yes pnpm@10 install --no-frozen-lockfile && npx pnpm@10 --filter @workspace/api-server build
    startCommand: npx pnpm@10 --filter @workspace/api-server start
    autoDeploy: true
    envVars:
      # ── Non-secret config ─────────────────────────────────────────
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: APP_URL
        value: https://aorane.onrender.com
      - key: API_BASE_URL
        value: https://aorane.onrender.com/api
      - key: ALLOWED_ORIGIN
        value: https://aorane.com
      - key: RESEND_FROM_EMAIL
        value: noreply@aorane.in

      # ── Secrets — set these in Render Dashboard → Environment ─────
      # Database (use your Supabase connection string)
      - key: DATABASE_URL
        sync: false
      # Auth tokens
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: ADMIN_JWT_SECRET
        sync: false
      - key: BUSINESS_JWT_SECRET
        sync: false
      # Email
      - key: RESEND_API_KEY
        sync: false
      # AI
      - key: NVIDIA_API_KEY
        sync: false
      # Payments
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # Google OAuth / Fit
      - key: GOOGLE_FIT_CLIENT_ID
        sync: false
      - key: GOOGLE_FIT_CLIENT_SECRET
        sync: false
      # Optional — SMS (Twilio)
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      # Optional — Weather
      - key: OPENWEATHER_API_KEY
        sync: false
      # Optional — WhatsApp
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
