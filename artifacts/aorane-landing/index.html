    <!-- "areaServed": "IN" and "priceCurrency": "INR" below must stay in sync

         market launches, update market.ts first, then mirror the values here. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://aorane.com/#organization",
          "name": "AORANE",
          "url": "https://aorane.com",
          "logo": {
            "@type": "ImageObject",
            "url": "https://aorane.com/logo-full.png"
          },
          "sameAs": [],
          "contactPoint": {
            "@type": "ContactPoint",
            "email": "support@aorane.com",
            "contactType": "customer support",
            "areaServed": "IN",
            "availableLanguage": ["English", "Hindi"]
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://aorane.com/#website",
          "url": "https://aorane.com",
          "name": "AORANE",
          "publisher": { "@id": "https://aorane.com/#organization" }
        },
        {
          "@type": "SoftwareApplication",
          "name": "AORANE Health App",
          "applicationCategory": "HealthApplication",
          "operatingSystem": "Android",
          "description": "India's most comprehensive AI health management platform. Track food with AI scanner, monitor stress, vitals, sleep, exercise and get AI-powered health insights.",
          "url": "https://aorane.com",
          "publisher": { "@id": "https://aorane.com/#organization" },
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "INR"
          }
        },
        {
          "@type": "FAQPage",
          "@id": "https://aorane.com/#faq",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "What is Aorane's Health Score and how is it calculated?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Aorane's Health Score is a single number from 0 to 100 that reflects your overall health, calculated using an ICMR/WHO-weighted formula that combines your food, exercise, sleep, and stress data into one composite score, updated daily."
              }
            },
            {
              "@type": "Question",
              "name": "Is Aorane free to use?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes, Aorane has a free forever plan that includes core health tracking features. Paid plans (Max, Pro, Family) unlock additional AI-powered features like advanced diet planning and family health management."
              }
            },
            {
              "@type": "Question",
              "name": "Does Aorane recognize Indian food?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes, Aorane's AI Food Scanner is trained to recognize over 3,000 Indian dishes, including regional foods, and logs full nutrition breakdown (calories, protein, carbs, fat, fiber) in under 2 seconds from a photo."
              }
            },
            {
              "@type": "Question",
              "name": "Is my health data safe and private on Aorane?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. Aorane offers 8 granular privacy controls, and sensitive data like stress logs, sleep records, and medicine history are private by default. All data is stored in India and the platform is fully compliant with India's DPDPA 2023. Aorane does not sell data or show ads."
              }
            },
            {
              "@type": "Question",
              "name": "Does Aorane sync with Google Fit or Samsung Health?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes, Aorane integrates with Google Health Connect on Android, which automatically syncs data from Google Fit, Samsung Health, and other connected health apps."
              }
            },
            {
              "@type": "Question",
              "name": "Can I track my family's health on Aorane?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes, Aorane's Family Health Hub lets one account manage health tracking for up to 6 family members from a single dashboard."
              }
            },
            {
              "@type": "Question",
              "name": "Is Aorane available on iOS?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Aorane's Android app is launching soon on the Google Play Store (in.aorane.app). An iOS version is planned for a future release."
              }
            },
            {
              "@type": "Question",
              "name": "Is Aorane a substitute for a doctor?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "No, Aorane is not a medical device and does not provide medical diagnoses. It is a wellness tracking and insights tool intended to complement, not replace, professional medical advice."
              }
            }
          ]
        }
      ]
    }
    </script>
