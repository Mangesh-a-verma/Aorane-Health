<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1640px; height: 624px; overflow: hidden; font-family: 'Poppins', sans-serif; }
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800;900&display=swap');

  .cover {
    width: 1640px; height: 624px;
    background: linear-gradient(120deg, #F0FFF4 0%, #C6F6D5 25%, #38A169 60%, #1A5C37 100%);
    position: relative; display: flex; align-items: center; overflow: hidden;
  }

  /* Wave shapes */
  .wave {
    position: absolute; top: 0; right: 0;
    width: 680px; height: 624px;
    background: linear-gradient(160deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.04) 100%);
    clip-path: polygon(30% 0%, 100% 0%, 100% 100%, 0% 100%);
  }

  /* Decorative dots grid */
  .dots {
    position: absolute; right: 40px; top: 30px;
    width: 200px; height: 200px;
    background-image: radial-gradient(circle, rgba(255,255,255,0.2) 1.5px, transparent 1.5px);
    background-size: 22px 22px;
  }

  /* Nutrition bar chart */
  .chart {
    position: absolute;
    right: 90px; bottom: 60px;
    display: flex; align-items: flex-end; gap: 14px;
    height: 200px;
  }
  .bar-col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .bar {
    width: 44px; border-radius: 8px 8px 0 0;
    background: rgba(255,255,255,0.3);
    transition: all 0.3s;
  }
  .bar-label { font-size: 11px; color: rgba(255,255,255,0.75); font-weight: 500; }

  /* Ring chart */
  .ring-area {
    position: absolute; right: 360px; top: 50px;
  }
  .ring-wrap {
    position: relative; width: 180px; height: 180px;
  }
  .ring-wrap svg { width: 180px; height: 180px; transform: rotate(-90deg); }
  .ring-center {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    text-align: center; color: white;
  }
  .ring-center .pct { font-size: 32px; font-weight: 800; }
  .ring-center .lbl { font-size: 11px; opacity: 0.8; }

  /* Left content */
  .content {
    padding-left: 90px; z-index: 10; max-width: 820px;
  }

  .logo { height: 52px; margin-bottom: 20px; filter: brightness(0) invert(1); }

  .tagline {
    font-size: 52px; font-weight: 800; color: white;
    line-height: 1.1; letter-spacing: -1px;
    text-shadow: 0 2px 16px rgba(0,0,0,0.1);
  }
  .tagline .hl { color: #F6E05E; }

  .pills {
    display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap;
  }
  .pill {
    background: rgba(255,255,255,0.2);
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 50px;
    padding: 7px 18px;
    font-size: 14px; color: white; font-weight: 500;
    display: flex; align-items: center; gap: 6px;
  }

  .sub { font-size: 18px; color: rgba(255,255,255,0.88); margin-top: 18px; font-weight: 300; }

  .bottom-strip {
    position: absolute; bottom: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, #F6E05E, #68D391, #4FD1C5, #76E4F7);
  }

  .website {
    position: absolute; bottom: 24px; left: 90px;
    font-size: 13px; color: rgba(255,255,255,0.65); letter-spacing: 1px;
  }
</style>
</head>
<body>
<div class="cover">
  <div class="wave"></div>
  <div class="dots"></div>

  <div class="content">
    <img src="logo-full.png" class="logo" alt="Aorane" />
    <div class="tagline">Track. Analyze.<br><span class="hl">Thrive.</span></div>
    <div class="sub">Smart nutrition & wellness tracking for every Indian</div>
    <div class="pills">
      <div class="pill">🥗 Nutrition Logs</div>
      <div class="pill">📊 Weekly Reports</div>
      <div class="pill">🔬 Blood Analysis</div>
      <div class="pill">💊 Supplement Guide</div>
    </div>
  </div>

  <!-- Ring chart -->
  <div class="ring-area">
    <div class="ring-wrap">
      <svg viewBox="0 0 180 180">
        <circle cx="90" cy="90" r="72" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="14"/>
        <circle cx="90" cy="90" r="72" fill="none" stroke="#F6E05E" stroke-width="14"
          stroke-dasharray="452" stroke-dashoffset="113" stroke-linecap="round"/>
      </svg>
      <div class="ring-center"><div class="pct">75%</div><div class="lbl">Daily Goal</div></div>
    </div>
  </div>

  <!-- Bar chart -->
  <div class="chart">
    <div class="bar-col"><div class="bar" style="height:80px;background:rgba(246,224,94,0.7)"></div><div class="bar-label">Carbs</div></div>
    <div class="bar-col"><div class="bar" style="height:140px;background:rgba(255,255,255,0.5)"></div><div class="bar-label">Protein</div></div>
    <div class="bar-col"><div class="bar" style="height:60px;background:rgba(104,211,145,0.7)"></div><div class="bar-label">Fat</div></div>
    <div class="bar-col"><div class="bar" style="height:100px;background:rgba(79,209,197,0.7)"></div><div class="bar-label">Fiber</div></div>
    <div class="bar-col"><div class="bar" style="height:50px;background:rgba(246,224,94,0.5)"></div><div class="bar-label">Iron</div></div>
  </div>

  <div class="website">www.aorane.com &nbsp;|&nbsp; Your Nutrition Intelligence</div>
  <div class="bottom-strip"></div>
</div>
</body>
</html>
