<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1640px; height: 624px; overflow: hidden; font-family: 'Poppins', sans-serif; }
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800;900&display=swap');

  .cover {
    width: 1640px;
    height: 624px;
    background: linear-gradient(135deg, #E0F7FA 0%, #B2EBF2 20%, #80DEEA 40%, #0097A7 70%, #006064 100%);
    position: relative;
    display: flex;
    align-items: center;
    overflow: hidden;
  }

  /* Decorative circles */
  .circle1 {
    position: absolute; width: 420px; height: 420px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    top: -100px; right: 180px;
  }
  .circle2 {
    position: absolute; width: 280px; height: 280px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    bottom: -80px; right: 300px;
  }
  .circle3 {
    position: absolute; width: 180px; height: 180px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    top: 40px; right: 520px;
  }
  .circle4 {
    position: absolute; width: 320px; height: 320px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.12);
    bottom: -120px; left: 480px;
  }

  /* Floating health icons */
  .icons-area {
    position: absolute; right: 60px; top: 0; bottom: 0;
    width: 580px;
    display: flex; align-items: center; justify-content: center;
  }

  .icon-card {
    position: absolute;
    background: rgba(255,255,255,0.18);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 20px;
    padding: 18px 22px;
    display: flex; align-items: center; gap: 12px;
  }
  .icon-card .emoji { font-size: 32px; }
  .icon-card .text { color: white; }
  .icon-card .text .val { font-size: 20px; font-weight: 700; }
  .icon-card .text .lbl { font-size: 11px; opacity: 0.85; font-weight: 400; }

  .card-heart { top: 60px; right: 80px; }
  .card-steps { top: 180px; right: 240px; }
  .card-water { top: 300px; right: 60px; }
  .card-sleep { top: 420px; right: 200px; }

  /* Heartbeat line */
  .heartbeat {
    position: absolute;
    bottom: 80px; right: 80px;
    width: 480px; height: 60px;
    opacity: 0.25;
  }

  /* Left content */
  .content {
    padding-left: 90px;
    z-index: 10;
    max-width: 860px;
  }

  .logo { height: 56px; object-fit: contain; margin-bottom: 22px; filter: brightness(0) invert(1); }

  .tagline {
    font-size: 54px;
    font-weight: 800;
    color: white;
    line-height: 1.1;
    letter-spacing: -1px;
    text-shadow: 0 2px 20px rgba(0,0,0,0.15);
  }

  .tagline span {
    color: #FFEB3B;
  }

  .sub {
    font-size: 20px;
    color: rgba(255,255,255,0.9);
    margin-top: 16px;
    font-weight: 300;
    letter-spacing: 0.5px;
  }

  .cta {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 28px;
    background: white;
    color: #006064;
    font-size: 16px;
    font-weight: 700;
    padding: 12px 28px;
    border-radius: 50px;
    letter-spacing: 0.3px;
  }

  .website {
    position: absolute;
    bottom: 28px; left: 90px;
    font-size: 14px;
    color: rgba(255,255,255,0.7);
    font-weight: 300;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
<div class="cover">
  <div class="circle1"></div>
  <div class="circle2"></div>
  <div class="circle3"></div>
  <div class="circle4"></div>

  <div class="content">
    <img src="logo-full.png" class="logo" alt="Aorane" />
    <div class="tagline">Your Health,<br><span>Digitized.</span></div>
    <div class="sub">Track vitals · Monitor nutrition · Stay ahead</div>
    <div class="cta">🌐 aorane.com</div>
  </div>

  <div class="icons-area">
    <div class="icon-card card-heart">
      <div class="emoji">❤️</div>
      <div class="text"><div class="val">72 bpm</div><div class="lbl">Heart Rate</div></div>
    </div>
    <div class="icon-card card-steps">
      <div class="emoji">🏃</div>
      <div class="text"><div class="val">8,432</div><div class="lbl">Steps Today</div></div>
    </div>
    <div class="icon-card card-water">
      <div class="emoji">💧</div>
      <div class="text"><div class="val">2.4 L</div><div class="lbl">Water Intake</div></div>
    </div>
    <div class="icon-card card-sleep">
      <div class="emoji">😴</div>
      <div class="text"><div class="val">7h 20m</div><div class="lbl">Sleep Quality</div></div>
    </div>
  </div>

  <div class="website">www.aorane.com &nbsp;|&nbsp; India's Health Platform</div>
</div>
</body>
</html>
