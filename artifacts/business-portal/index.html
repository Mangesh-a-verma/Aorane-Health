            "@type": "Offer",
            "price": "0",

          "@type": "FAQPage",
          "@id": "https://business.aorane.com/#faq",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "Can we see individual employees' health data?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "No. Aorane Business only shows aggregate, anonymized insights (like department-level average health scores or stress trends). Individual employee health data stays private to that employee, in line with India's DPDPA 2023."
              }
            },
            {
              "@type": "Question",
              "name": "How is Aorane Business priced?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Pricing is per-seat, based on the number of employees or members you enroll. Contact us for a quote based on your organization size — a free trial is available to get started."
              }
            },
            {
              "@type": "Question",
              "name": "How long does setup take?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Most organizations are up and running within a day. You get a bulk enrollment code your employees use to join via the Aorane app — no individual onboarding calls needed."
              }
            },
            {
              "@type": "Question",
              "name": "Do employees need to install a separate app?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "No. Employees use the same free Aorane consumer app they may already have — they just enter your organization's enrollment code once to link their account."
              }
            },
            {
              "@type": "Question",
              "name": "Is Aorane Business suitable for hospitals, gyms, and schools, or only corporates?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Aorane Business is built to serve Corporates, Hospitals, Gyms, Yoga Studios, Schools, and Insurance companies — anywhere an organization wants to understand aggregate wellness trends across a group of people."
              }
            },
            {
              "@type": "Question",
              "name": "Can we cancel or downgrade anytime?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes, there are no long-term lock-in contracts required. You can adjust your seat count or cancel at any time from your account settings."
              }
            }
          ]
        }
      ]
    }
