<svg width="680" height="380" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, Segoe UI, sans-serif">
<title>AORANE business model — individual and corporate sides on one platform</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5B6B7A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect width="680" height="380" fill="#FFFFFF"/>

<text x="235" y="20" text-anchor="middle" font-size="12" fill="#5B6B7A">Consumers</text>
<line x1="235" y1="28" x2="235" y2="128" stroke="#5B6B7A" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="465" y="20" text-anchor="middle" font-size="12" fill="#5B6B7A">Companies</text>
<line x1="465" y1="28" x2="465" y2="128" stroke="#5B6B7A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="100" y="70" width="500" height="230" rx="20" fill="#F0FBF9" stroke="#0F9C8D" stroke-width="1"/>
<text x="350" y="94" text-anchor="middle" font-size="14" font-weight="600" fill="#0F6B60">AORANE PLATFORM</text>

<rect x="130" y="130" width="210" height="150" rx="12" fill="#EAF3FF" stroke="#2E6FDB" stroke-width="1"/>
<text x="235" y="164" text-anchor="middle" font-size="15" font-weight="600" fill="#1E4C99">Individual (B2C)</text>
<text x="235" y="188" text-anchor="middle" font-size="12" fill="#3D5A85">App, wearables,</text>
<text x="235" y="206" text-anchor="middle" font-size="12" fill="#3D5A85">AI coach</text>

<rect x="360" y="130" width="210" height="150" rx="12" fill="#FFF1EE" stroke="#E0603F" stroke-width="1"/>
<text x="465" y="164" text-anchor="middle" font-size="15" font-weight="600" fill="#A6371F">Corporate (B2B)</text>
<text x="465" y="188" text-anchor="middle" font-size="12" fill="#8A4A38">Org wellness</text>
<text x="465" y="206" text-anchor="middle" font-size="12" fill="#8A4A38">dashboard</text>

<line x1="235" y1="280" x2="235" y2="340" stroke="#5B6B7A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="235" y="358" text-anchor="middle" font-size="12" fill="#5B6B7A">Subscription revenue</text>

<line x1="465" y1="280" x2="465" y2="340" stroke="#5B6B7A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="465" y="358" text-anchor="middle" font-size="12" fill="#5B6B7A">Seat-based revenue</text>
</svg>
